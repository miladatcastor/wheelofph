<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Name Wheel</title>
<style>
/* ---------- theme ---------- */
:root{
  --bg:#f5f2ea;
  --panel:#ffffff;
  --ink:#211f1b;
  --muted:#6c6559;
  --line:#ded6c6;
  --accent:#d8503f;
  --focus:#2f6fed;
  --shadow:rgba(40,33,20,.18);

  --slice-s:60%;
  --slice-l:73%;
  --slice-ink:#1c1913;
  --slice-edge:rgba(28,25,19,.35);

  --rim:#2a251e;
  --hub:#ffffff;

  --skin:#f2c9a2;
  --stroke:#2a251e;
  --hair:#3a2f27;
  --eye:#2a251e;
  --mouth:#7d2f2a;
  --sweat:#5aa9e6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16151a;
    --panel:#201f26;
    --ink:#eeeae2;
    --muted:#a49c8f;
    --line:#35333d;
    --accent:#ff7a66;
    --focus:#7aa2ff;
    --shadow:rgba(0,0,0,.55);

    --slice-s:42%;
    --slice-l:40%;
    --slice-ink:#f4efe6;
    --slice-edge:rgba(0,0,0,.45);

    --rim:#0d0c10;
    --hub:#2b2933;

    --skin:#d9a273;
    --stroke:#14131a;
    --hair:#1b1720;
    --eye:#14131a;
    --mouth:#4d1714;
    --sweat:#8ecdf7;
  }
}

*{box-sizing:border-box}
html,body{margin:0}
/* The app is exactly one viewport and never scrolls, so it must never be able
   to raise a scrollbar. This is not tidiness. `.wheel` is a square that is
   permanently rotating, and the axis-aligned bounding box of a rotating square
   swells by 41% at 45deg and shrinks back - that box counts as document
   overflow, so the page's scroll height pulses every single frame. On a laptop
   screen macOS uses overlay scrollbars, which float above the layout, so
   nothing moves and the bug is invisible. Plug in a monitor and you have
   usually plugged in a mouse, and macOS switches to classic scrollbars that
   take real layout width: the bar appears, steals 15px, the narrower viewport
   shrinks the stage, the smaller wheel no longer overflows, the bar goes, the
   wheel grows back - a loop that runs every frame and reads as the wheel
   shaking itself. Scoped with :has() because ?inspect replaces .app outright
   and that contact sheet does need to scroll. */
html:has(.app){overflow:hidden}
body{
  background:var(--bg);
  color:var(--ink);
  font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
/* The wheel takes whatever the viewport will give it: the app is a full-height
   column, and the stage is the leftover square in the middle of it. */
.app{height:100dvh;display:flex;flex-direction:column;padding:10px 12px}
.masthead{flex:none}
h1{font-size:clamp(18px,2vw,24px);margin:0 0 2px;letter-spacing:-.02em}
.sub{margin:0;color:var(--muted);font-size:12.5px;line-height:1.4}

.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;min-height:0;min-width:0}

/* ---------- wheel ---------- */
.stage{position:relative;flex:1 1 auto;min-height:0;aspect-ratio:1;
  max-width:100%;max-height:100%;margin:0 auto}
.wheel-wrap{position:absolute;inset:0;border-radius:50%;box-shadow:0 12px 34px var(--shadow)}
.wheel{width:100%;height:100%;will-change:transform;transform:rotate(0deg)}
.wheel svg{display:block;width:100%;height:100%;overflow:visible}
.pointer{
  position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  width:0;height:0;z-index:3;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-top:28px solid var(--accent);
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));
}
.hub{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:17%;aspect-ratio:1;border-radius:50%;
  background:var(--hub);border:3px solid var(--rim);z-index:4;
  font:inherit;font-weight:800;letter-spacing:.04em;color:var(--accent);
  font-size:clamp(10px,1.5vw,17px);text-transform:uppercase;
  cursor:pointer;padding:0;
  transition:background .15s,color .15s;
}
.hub:hover:not(:disabled){background:var(--accent);color:#fff}
.hub:active:not(:disabled){transform:translate(-50%,-50%) scale(.96)}
.hub:disabled{cursor:not-allowed;color:var(--muted)}

.slice{fill:hsl(var(--hue,0) var(--slice-s) var(--slice-l));stroke:var(--slice-edge);stroke-width:1.25;cursor:pointer}
.slice.chosen{stroke:var(--accent);stroke-width:4}
.char{cursor:pointer}

.menu{
  position:fixed;z-index:40;min-width:210px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);
  display:flex;flex-direction:column;gap:2px;
}
.menu[hidden]{display:none}
.menu-who{
  margin:0;padding:6px 10px 7px;font-size:12px;font-weight:700;
  color:var(--muted);border-bottom:1px solid var(--line);
}
.menu button{
  font:inherit;font-size:13px;font-weight:600;text-align:left;
  color:var(--ink);background:none;border:none;border-radius:8px;
  padding:9px 10px;cursor:pointer;
}
.menu button:hover:not(:disabled){background:var(--bg);color:var(--accent)}
.menu button:disabled{color:var(--muted);cursor:not-allowed}
.rim{fill:none;stroke:var(--rim);stroke-width:5}
.label{
  fill:var(--slice-ink);
  font-family:inherit;font-weight:650;
  text-anchor:middle;dominant-baseline:middle;
}
.empty{fill:var(--muted);font-size:16px;text-anchor:middle;dominant-baseline:middle}

/* ---------- characters ---------- */
.char .shadow{fill:rgba(0,0,0,.16)}
.char .skin{fill:var(--skin);stroke:var(--stroke);stroke-width:1.6}
.char .hair{fill:var(--hair)}
.char .hair-back .hair{fill:var(--hair-back, var(--hair))}
.char .freckle{fill:rgba(140,82,60,.5)}
.char .shine{fill:rgba(255,255,255,.28)}
.char .say-box{fill:var(--panel);stroke:var(--stroke);stroke-width:1.6;stroke-linejoin:round}
.char .say-text{
  font-family:inherit;font-size:8px;font-weight:750;fill:var(--ink);
  text-anchor:middle;dominant-baseline:middle;
}
@keyframes pop{
  0%{opacity:0;transform:scale(.3)}
  55%{opacity:1;transform:scale(1.1)}
  75%{transform:scale(.97)}
  100%{opacity:1;transform:scale(1)}
}
.char .bubble{transform-box:fill-box;transform-origin:14% 100%;animation:pop .34s ease-out both}
.char .stubble{opacity:.42}
.char .collar{fill:var(--collar,#1f2a4d);stroke:var(--stroke);stroke-width:1.4}
/* a painted lip reads at wheel size where a hairline stroke would not */
.char.lips .mouth{stroke-width:2.6}
.char .beard{fill:var(--beard, var(--hair))}
.char .glasses{fill:none;stroke:#14110e;stroke-width:1.7;stroke-linecap:round}
/* on a beard the mouth needs a light edge to stay legible */
.char.bearded .mouth-f{stroke:var(--skin);stroke-width:1.4}
.char.bearded .mouth{stroke:#e9a9a2}
.char .neck{fill:var(--skin);stroke:var(--stroke);stroke-width:1.4}
.char .top{fill:var(--top-col, hsl(var(--hue,0) 52% 34%));stroke:var(--stroke);stroke-width:1.6}
.char .brow{fill:none;stroke:var(--eye);stroke-width:1.9;stroke-linecap:round}
.char .eye{fill:var(--eye)}
.char .glint{fill:#fff}
.char .eye-w{fill:#fff;stroke:var(--eye);stroke-width:1.2}
.char .xeye{fill:none;stroke:var(--eye);stroke-width:1.9;stroke-linecap:round}
.char .shut{fill:none;stroke:var(--eye);stroke-width:1.8;stroke-linecap:round}
.char .mouth{fill:none;stroke:var(--lip, var(--mouth));stroke-width:1.8;stroke-linecap:round}
.char .mouth-f{fill:var(--mouth);stroke:var(--stroke);stroke-width:1.1}
.char .limb-o{fill:none;stroke:var(--stroke);stroke-width:7;stroke-linecap:round}
.char .limb{fill:none;stroke:var(--skin);stroke-width:4;stroke-linecap:round}
/* hands sit a shade lighter than the arm so the wrist reads at wheel size */
.char .hand{fill:var(--skin);stroke:var(--stroke);stroke-width:1.7}
.char .hand{fill:color-mix(in srgb, var(--skin) 84%, white)}
.char .drop{fill:var(--sweat);stroke:var(--stroke);stroke-width:1}
.char .photo-ring{fill:none;stroke:var(--stroke);stroke-width:1.8}
/* a light backing so the X eyes read against any photo */
.char .xeye-halo{fill:none;stroke:#fff;stroke-width:4.6;stroke-linecap:round;opacity:.92}
.char .spark{fill:none;stroke:#ffd34d;stroke-width:1.8;stroke-linecap:round}
.char .anger{fill:none;stroke:#d8503f;stroke-width:1.7;stroke-linecap:round}
.char{--dir:1}
.char[data-state="angry-left"]{--dir:-1}
.char .swoosh{fill:none;stroke:rgba(255,255,255,.85);stroke-width:3;stroke-linecap:round;opacity:0}
.char .ring{fill:none;stroke:rgba(255,255,255,.9);stroke-width:2.4}
.char .puff{fill:none;stroke:rgba(255,255,255,.85);stroke-width:2.4;stroke-linecap:round}
.char .thud{opacity:0}
/* a photo head replaces the drawn one; overlays stay on top */
.char.has-photo .drawn-head{display:none !important}

/* pose visibility: one block per state, driven by data-show */
.char [data-show]{display:none}
.char[data-state="idle"]     [data-show~="idle"]     {display:block}
.char[data-state="nervous"]  [data-show~="nervous"]  {display:block}
.char[data-state="panic"]    [data-show~="panic"]    {display:block}
.char[data-state="doomed"]   [data-show~="doomed"]   {display:block}
.char[data-state="relieved"] [data-show~="relieved"] {display:block}
.char[data-state="stomp"]    [data-show~="stomp"]    {display:block}
.char[data-state="angry-right"] [data-show~="angry-right"]{display:block}
.char[data-state="angry-left"]  [data-show~="angry-left"] {display:block}
.char[data-state="accept"]      [data-show~="accept"]     {display:block}
.char[data-state="bristle"]     [data-show~="bristle"]    {display:block}
.char[data-state="gloat"]       [data-show~="gloat"]      {display:block}
.char[data-state="smug"]        [data-show~="smug"]       {display:block}
.char[data-state="cheer"]       [data-show~="cheer"]      {display:block}
.char[data-state="gotcha-right"] [data-show~="gotcha-right"]{display:block}
.char[data-state="gotcha-left"] [data-show~="gotcha-left"] {display:block}
.char[data-state="ring"]        [data-show~="ring"]       {display:block}

/* Waiting to start, everyone closes in toward the hub and links up. --pull is
   worked out per list length in render(), since how far in they have to come
   for their hands to meet depends on how many of them there are. */
.char .orbit{transform:translateY(0);transition:transform .7s cubic-bezier(.3,0,.2,1)}
.wheel.resting .char .orbit{transform:translateY(calc(var(--pull,0) * 1px))}
@keyframes ringBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.7px)}}
.char[data-state="ring"] .body-all{
  transform-box:fill-box;
  animation:ringBob 2.6s var(--d,0s) ease-in-out infinite;
}

/* ---------- character motion ---------- */
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.055)}}
@keyframes sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}
@keyframes chomp{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1.2)}}
@keyframes shakeh{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(11deg)}}
@keyframes quake{0%{transform:translate(-2.6px,0) rotate(-3.2deg)}50%{transform:translate(2.6px,1.3px) rotate(3.2deg)}100%{transform:translate(-2.6px,0) rotate(-3.2deg)}}
/* doubled over, rocking with it */
@keyframes gloatRock{
  0%,100%{transform:rotate(-7deg) translateY(0)}
  50%{transform:rotate(1deg) translateY(-1.4px)}
}
@keyframes jab{
  0%,100%{transform:rotate(4deg)}
  50%{transform:rotate(-7deg)}
}
/* leaning after the one they just landed it on, shaking with it */
@keyframes gotchaRock{
  0%,100%{transform:rotate(calc(-6deg * var(--dir))) translateY(0)}
  50%{transform:rotate(calc(1.5deg * var(--dir))) translateY(-1.6px)}
}
/* barely moving, which is the point */
@keyframes smugSway{
  0%,100%{transform:rotate(-2.2deg)}
  50%{transform:rotate(2.2deg)}
}
@keyframes cheerHop{
  0%,100%{transform:translateY(0) scale(1,1)}
  35%{transform:translateY(-4.5px) scale(.97,1.05)}
  70%{transform:translateY(0) scale(1.05,.95)}
}
@keyframes wipe{0%,100%{transform:translateX(-3.2px)}50%{transform:translateX(3.2px)}}
/* Both legs rest pointing straight down, so 0% and 100% are just standing.
   The thigh swings from the hip, the shin from the knee: folded through the
   wind-up, straight at the strike. */
/* A whole-body jump reads at 90px where a swinging leg does not: the entire
   silhouette leaves the ground, then squashes flat on the landing. */
@keyframes stomp{
  0%{transform:translateY(0) scale(1,1)}
  20%{transform:translateY(2px) scale(1.09,.83)}    /* crouch */
  30%{transform:translateY(1px) scale(1.06,.88)}
  46%{transform:translateY(-18px) scale(.93,1.13)}  /* launch, stretched thin */
  58%{transform:translateY(-20px) scale(.96,1.08)}  /* hang */
  70%{transform:translateY(-4px) scale(1.02,1.02)}  /* dropping */
  74%{transform:translateY(2px) scale(1.24,.72)}    /* IMPACT - wheel goes here */
  82%{transform:translateY(0) scale(.95,1.06)}      /* rebound */
  90%{transform:translateY(0) scale(1.03,.98)}
  100%{transform:translateY(0) scale(1,1)}
}
@keyframes thud{
  0%,70%{opacity:0;transform:scale(.35)}
  75%{opacity:.95;transform:scale(1)}
  100%{opacity:0;transform:scale(1.7)}
}
@keyframes shove{
  0%{transform:translateX(0) rotate(0)}
  25%{transform:translateX(calc(-2.4px * var(--dir))) rotate(calc(-6deg * var(--dir)))}
  45%{transform:translateX(calc(5px * var(--dir))) rotate(calc(11deg * var(--dir)))}
  60%{transform:translateX(calc(3.4px * var(--dir))) rotate(calc(7deg * var(--dir)))}
  100%{transform:translateX(0) rotate(0)}
}
/* the body lean alone is invisible at 90px tall; the arms have to travel */
/* Cocks back and HOLDS. Deliberately never reaches the thrust, so caving
   cannot be mistaken for a shove that failed to move the wheel. */
@keyframes bristle{
  0%{transform:translateX(0) rotate(0)}
  45%{transform:translateX(calc(-2.8px * var(--dir))) rotate(calc(-8deg * var(--dir)))}
  100%{transform:translateX(calc(-2.4px * var(--dir))) rotate(calc(-7deg * var(--dir)))}
}
@keyframes bristleArms{
  0%{transform:translateX(calc(-1px * var(--dir)))}
  45%{transform:translateX(calc(-7.5px * var(--dir)))}
  100%{transform:translateX(calc(-6.5px * var(--dir)))}
}
@keyframes shoveArms{
  0%{transform:translateX(calc(-2px * var(--dir)))}
  25%{transform:translateX(calc(-6px * var(--dir)))}
  45%{transform:translateX(calc(8px * var(--dir)))}
  60%{transform:translateX(calc(6px * var(--dir)))}
  100%{transform:translateX(0)}
}
/* they bristle, then the fight goes out of them */
@keyframes slump{
  0%{transform:translateY(-0.6px) rotate(0)}
  40%{transform:translateY(1.8px) rotate(-1.5deg)}
  100%{transform:translateY(1.3px) rotate(0)}
}
@keyframes pushfx{
  0%,32%{opacity:0}
  45%{opacity:.9}
  62%{opacity:0}
  100%{opacity:0}
}
@keyframes drip{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(11px);opacity:0}}

.char .breathe,.char .head,.char .jaw,.char .body-all,.char .wipe,.char .sweat{
  transform-box:fill-box;
}
.char[data-state="idle"] .breathe{
  transform-origin:50% 100%;
  animation:breathe 3.6s var(--d,0s) ease-in-out infinite;
}
.char[data-state="idle"] .head{
  transform-origin:50% 92%;
  animation:sway 4.4s var(--d,0s) ease-in-out infinite;
}
.char[data-state="nervous"] .jaw{
  transform-origin:50% 18%;
  animation:chomp .2s ease-in-out infinite;
}
.char[data-state="nervous"] .sweat{
  transform-origin:50% 0;
  animation:drip 1.1s var(--d,0s) linear infinite;
}
.char[data-state="panic"] .head{
  transform-origin:50% 92%;
  animation:shakeh .22s ease-in-out infinite;   /* 4.5Hz: survives 30fps capture */
}
.char[data-state="doomed"] .body-all{
  transform-origin:50% 100%;
  animation:quake .2s linear infinite;         /* 5Hz: survives 30fps capture */
}
.char[data-state="stomp"] .body-all{
  transform-box:fill-box;
  transform-origin:50% 100%;
  animation:stomp 1s cubic-bezier(.4,0,.5,1) both;
}
.char[data-state="stomp"] .thud{
  transform-box:fill-box;
  transform-origin:50% 50%;
  animation:thud 1s linear both;
}
.char[data-state="angry-right"] .body-all,
.char[data-state="angry-left"] .body-all{
  transform-box:fill-box;
  transform-origin:50% 100%;
  animation:shove 1s ease-in-out both;
}
.char[data-state="angry-right"] .shove-arms,
.char[data-state="angry-left"] .shove-arms{
  transform-box:fill-box;
  animation:shoveArms 1s ease-in-out both;
}
.char[data-state="angry-right"] .pushfx,
.char[data-state="angry-left"] .pushfx{animation:pushfx 1s linear both}
.char[data-state="bristle"] .body-all{
  transform-box:fill-box;
  transform-origin:50% 100%;
  animation:bristle .5s ease-out both;
}
.char[data-state="bristle"] .shove-arms{
  transform-box:fill-box;
  animation:bristleArms .5s ease-out both;
}
.char[data-state="accept"] .body-all{
  transform-box:fill-box;
  transform-origin:50% 100%;
  animation:slump .5s ease-out both;
}
.char .pushfx{opacity:0}
.char[data-state="gloat"] .body-all{
  transform-box:fill-box;transform-origin:50% 100%;
  animation:gloatRock .58s ease-in-out infinite;
}
.char[data-state="gloat"] .jab,
.char[data-state="gotcha-right"] .jab,
.char[data-state="gotcha-left"] .jab{
  transform-box:fill-box;transform-origin:0% 100%;
  animation:jab .52s ease-in-out infinite;
}
.char[data-state="gotcha-right"] .body-all,
.char[data-state="gotcha-left"] .body-all{
  transform-box:fill-box;transform-origin:50% 100%;
  animation:gotchaRock .52s ease-in-out infinite;
}
/* the lean follows the arm: pointing left means leaning left */
.char[data-state="gotcha-left"]{--dir:-1}
.char[data-state="smug"] .body-all{
  transform-box:fill-box;transform-origin:50% 100%;
  animation:smugSway 2.8s ease-in-out infinite;
}
.char[data-state="cheer"] .body-all{
  transform-box:fill-box;transform-origin:50% 100%;
  animation:cheerHop .62s ease-in-out infinite;
}
.char[data-state="relieved"] .wipe{
  transform-origin:50% 50%;
  animation:wipe 1.2s ease-in-out infinite;
}

/* While the wheel is moving, nobody can see an idle character breathe, but
   those loops still force the rotating layer to repaint every frame. */
.wheel.spinning .char[data-state="idle"] .breathe,
.wheel.spinning .char[data-state="idle"] .head{animation:none}

@media (prefers-reduced-motion: reduce){
  .char *{animation:none !important}
}

/* ---------- controls ---------- */
.result{
  flex:none;margin:0;text-align:center;
  font-size:clamp(16px,2.2vw,22px);font-weight:650;min-height:1.5em;
}
/* The controls are a drawer now, so the wheel owns the screen. */
.cog{
  position:fixed;top:10px;right:12px;z-index:30;
  font:inherit;font-size:12px;font-weight:650;letter-spacing:.02em;
  color:var(--muted);background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;
  box-shadow:0 1px 6px rgba(0,0,0,.06);
}
.cog:hover{color:var(--ink);border-color:var(--accent)}
.panel{
  position:fixed;top:0;right:0;z-index:20;
  width:min(92vw,320px);height:100dvh;
  background:var(--panel);border-left:1px solid var(--line);
  padding:52px 16px 20px;display:flex;flex-direction:column;gap:12px;
  box-shadow:-6px 0 24px rgba(0,0,0,.12);
  overflow:auto;
}
/* a class selector outranks the UA's [hidden]{display:none}, so say it again */
.panel[hidden]{display:none}

/* Below the two-column breakpoint the wheel is limited by width rather than by
   height. The controls stay reachable without scrolling either way - the drawer
   is position:fixed with its own overflow. */
@media (max-width:819px){
  .app{height:100dvh}
  .stage{max-width:100%}
}
.btn{
  font:inherit;font-weight:700;color:#fff;background:var(--accent);
  border:none;border-radius:10px;padding:13px 18px;cursor:pointer;
  letter-spacing:.02em;
}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
label{font-size:13px;font-weight:650;color:var(--muted)}
textarea{
  font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:10px;
  width:100%;min-height:180px;resize:vertical;
}
.hint{margin:0;font-size:12px;color:var(--muted)}

/* face chips */
.faces{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.face{display:inline-flex;align-items:center;background:var(--bg);
  border:1px solid var(--line);border-radius:999px;overflow:hidden}
.face.set{border-color:var(--accent)}
.face button{font:inherit;font-size:12px;font-weight:650;color:var(--ink);
  background:none;border:none;cursor:pointer;padding:0}
.face-btn{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px}
.face-btn:hover{color:var(--accent)}
.av{width:22px;height:22px;border-radius:50%;flex:none;overflow:hidden;
  background:hsl(var(--hue,0) var(--slice-s) var(--slice-l));
  display:grid;place-items:center;font-size:11px;color:var(--slice-ink)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.face-x{padding:3px 9px 3px 7px;margin-left:-2px;color:var(--muted);line-height:1;font-size:15px}
.face-x:hover{color:var(--accent)}

.opt{display:flex;align-items:flex-start;gap:8px;font-size:12px;font-weight:500;
  color:var(--muted);line-height:1.45;cursor:pointer}
.opt input{margin:2px 0 0;accent-color:var(--accent);flex:none;cursor:pointer}

/* ---------- ?inspect contact sheet ---------- */
.inspect{padding:14px 16px 40px;font:13px/1.5 ui-sans-serif,system-ui,sans-serif;color:var(--ink)}
.inspect h2{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  color:var(--muted);margin:18px 0 6px}
.ins-row{display:flex;flex-wrap:wrap;gap:4px}
.ins-cell{background:#e8a98f;border-radius:6px;position:relative;overflow:hidden}
.ins-cell svg{display:block;width:100%}
.ins-cell b{position:absolute;left:4px;bottom:2px;font:600 9px ui-sans-serif,system-ui,sans-serif;
  color:#4a3c30}
.ins-audit{margin:0;padding:9px 12px;border-radius:9px;font-weight:650;
  background:#e3f0e3;color:#1f5c2e;border:1px solid #b9d9bd}
.ins-audit.bad{background:#fbe4e2;color:#8c231a;border-color:#eab4ae}

:where(button,textarea,input,a,[tabindex]):focus-visible{
  outline:3px solid var(--focus);outline-offset:2px;border-radius:10px;
}
</style>
</head>
<body>
<main class="app">
  <div class="layout">
    <div class="col">
      <div class="stage">
        <div class="pointer" aria-hidden="true"></div>
        <div class="wheel-wrap">
          <div class="wheel" id="wheel">
            <svg id="svg" viewBox="0 0 400 400" role="img" aria-label="Wheel of names"></svg>
          </div>
          <button class="hub" id="spin" type="button">Spin</button>
        </div>
      </div>
      <p class="result" id="result" role="status" aria-live="polite">Ready when you are.</p>
    </div>

  </div>

  <button class="cog" id="cog" type="button" aria-expanded="false" aria-controls="panel">Names</button>

  <div class="menu" id="menu" role="menu" hidden>
    <p class="menu-who" id="menuWho"></p>
    <button type="button" data-act="jump" role="menuitem">Make them the jumper</button>
    <button type="button" data-act="remove" role="menuitem">Remove from the wheel</button>
  </div>

  <aside class="panel" id="panel" hidden>
      <header class="masthead">
        <h1>Name Wheel</h1>
        <p class="sub">Spin it. Somebody is going to have a bad time.</p>
      </header>
      <div>
        <label for="names">Names — one per line</label>
        <textarea id="names" spellcheck="false" aria-describedby="hint"></textarea>
      </div>
      <p class="hint" id="hint">The wheel rebuilds as you type. 2&ndash;24 names work best.</p>
      <div>
        <label id="faceslabel">Faces &mdash; tap a name to use a photo</label>
        <div class="faces" id="faces" role="group" aria-labelledby="faceslabel"></div>
      </div>
      <label class="opt" for="sore">
        <input type="checkbox" id="sore" checked>
        <span>Sore losers &mdash; whoever gets picked squares up and either
        shoves the wheel a notch left or right, landing a neighbour in it, or
        thinks better of it and takes the hit. Even odds on all three.</span>
      </label>
      <input type="file" id="file" accept="image/*" hidden>
  </aside>
</main>

<script>
(function(){
  "use strict";

  var svg      = document.getElementById('svg');
  var wheel    = document.getElementById('wheel');
  var spinBtn  = document.getElementById('spin');
  var namesEl  = document.getElementById('names');
  var resultEl = document.getElementById('result');
  var soreEl   = document.getElementById('sore');
  var facesEl  = document.getElementById('faces');
  var fileEl   = document.getElementById('file');

  var pendingFace = -1;

  var CX = 200, CY = 200, R = 186, MAX = 24;
  var DEFAULT_NAMES = ['Milad','Andrea','Eugenia','Rafal','Andre'];

  /* SEAM: per-character appearance, separate from state. A look sets colours
     (CSS custom properties) and switches on pre-drawn feature groups. */
  var SEED_LOOKS = {
    'Milad':  { skin:'#c9a078', hair:'#14121c', beard:'#33292a', top:'#ece7dd',
                hairStyle:'thick', glasses:'wide', head:{ rx:11.8, ry:16.6 } },
    'Andrea': { skin:'#dca786', hair:'#1f1811', beard:'#533828', top:'#83859f',
                hairStyle:'curly', glasses:'tall', head:{ rx:11.2, ry:17.5 } },
    'Eugenia':{ skin:'#dfb8a2', hair:'#6b5443', top:'#f2f4f7', collar:'#1f2a4d',
                lip:'#9c4f5c', freckles:true,
                hairStyle:'long', head:{ rx:11.5, ry:17 } },
    'Rafal':  { skin:'#cea08a', beard:'#472f22', top:'#e6e3e0', collar:'#b9bfc6',
                hairStyle:'bald', beardStyle:'full', head:{ rx:12.4, ry:15.9 } },
    'Andre':  { skin:'#deb096', hair:'#241c18', beard:'#4a3a33', top:'#0d184a',
                stripe:'#ddd2cc', stripe2:'#b5635e',
                hairStyle:'swept', beardStyle:'stubble', head:{ rx:12, ry:16.3 } }
  };

  /* ------------------------------------------------------------------
     SEAM 1: `characters` is the only source of truth.
     Every entry: { name, state, hue, headImage }
     Rendering reads from it; nothing else stores character state.
  ------------------------------------------------------------------ */
  var characters = [];
  var charEls    = [];
  /* Held by name, not index, so it survives a shuffle or an edit. */
  var chosenJumper = null;

  var rotation = 0;
  var spinning = false;
  var rafId    = 0;
  var stopTimer= 0;
  var stompTimer= 0;
  var driftTimer= 0;
  var DRIFT_MS  = 52000;   /* one unhurried revolution */
  var holdTimer= 0;
  var shoveTimer= 0;

  function mod(a,n){ return ((a % n) + n) % n; }
  function f(n){ return Math.round(n*100)/100; }
  function polar(deg,r){
    var a = (deg-90) * Math.PI/180;
    return [CX + r*Math.cos(a), CY + r*Math.sin(a)];
  }
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function trunc(s){ return s.length > 14 ? s.slice(0,13) + '…' : s; }

  /* ------------------------------------------------------------------
     SEAM 3: every pose / expression is an SVG group tagged with
     data-show="stateA stateB". One CSS block per state decides what
     is visible. Adding a sixth state = new groups + one CSS block.
  ------------------------------------------------------------------ */
  function limb(d){
    return '<path class="limb-o" d="'+d+'"/><path class="limb" d="'+d+'"/>';
  }
  function hand(x,y){
    return '<circle class="hand" cx="'+x+'" cy="'+y+'" r="4"/>';
  }
  function foot(x,y){
    return '<circle class="hand" cx="'+x+'" cy="'+y+'" r="3.6"/>';
  }
  function drop(x,y){
    return '<g transform="translate('+x+' '+y+')"><g class="sweat">'
         + '<path class="drop" d="M0,-4.2 C1.9,-1.4 3,-.2 3,1.4 A3,3 0 1 1 -3,1.4 C-3,-.2 -1.9,-1.4 0,-4.2 Z"/>'
         + '</g></g>';
  }

  var ARM_DOWN_L = 'M-11,-5 q-5,7 -3,14';
  var ARM_DOWN_R = 'M11,-5 q5,7 3,14';

  var CHAR_MARKUP =
    '<g class="orbit">'
    + '<g class="body-all">'
    + '<ellipse class="shadow" cx="0" cy="23.5" rx="12" ry="3"/>'
    + '<g data-show="stomp"><g class="thud">'
      + '<ellipse class="ring" cx="0" cy="22.5" rx="11" ry="3"/>'
      + '<path class="puff" d="M-14,20 l-5,-2.5 M14,20 l5,-2.5'
      + ' M-12.5,24 l-6,1 M12.5,24 l6,1"/>'
    + '</g></g>'

    /* long hair falls behind the whole body, so it lands before everything
       else; it carries the head transform so it stays married to the skull */
    + '%HAIRBACK%'

    /* legs, drawn behind the torso so only the stubs show */
    + '<g data-show="idle nervous panic doomed relieved gloat smug cheer ring'
      + ' gotcha-left gotcha-right angry-left angry-right accept bristle stomp">'
      + limb('M-4.5,11 v10') + foot(-4.5,21)
      + limb('M4.5,11 v10')  + foot(4.5,21)
    + '</g>'

    /* torso (breathes on idle) */
    + '<g class="breathe">'
      + '<path class="neck" d="M-3.5,-14.5 L3.5,-14.5 L4.3,-6.5 L-4.3,-6.5 Z"/>'
      + '%TOP%'
      + '%STRIPES%'
      + '%COLLAR%'
    + '</g>'


    /* head + face */
    + '<g class="head">'
      /* head-shape carries the look's skull proportions; .head stays free for
         the CSS sway/shake, which would otherwise overwrite this transform */
      + '<g class="head-shape"%HEADT%>'
      + '<g class="drawn-head">'
      + '<circle class="skin" cx="0" cy="-24" r="14"/>'
      + '%BEARD%'
      + '%HAIR%'
      + '%FRECKLES%'

      /* Feature bands. The skull stretches; these ride it so they sit at the
         right height, but undo the stretch so eyes and frames keep true shape. */
      + '<g%BANDE%>'

      /* brows */
      + '<g data-show="idle stomp ring">'
        + '<path class="brow" d="M-9,-30.8 h6"/><path class="brow" d="M3,-30.8 h6"/>'
      + '</g>'
      + '<g data-show="nervous panic doomed">'
        + '<path class="brow" d="M-9.5,-29.2 q3.2,-1.3 6,-2.3"/>'
        + '<path class="brow" d="M9.5,-29.2 q-3.2,-1.3 -6,-2.3"/>'
      + '</g>'
      + '<g data-show="relieved gloat smug cheer gotcha-left gotcha-right">'
        + '<path class="brow" d="M-9.5,-29.6 q3,-2.6 6,0"/><path class="brow" d="M3.5,-29.6 q3,-2.6 6,0"/>'
      + '</g>'
      + '<g data-show="angry-left angry-right bristle">'
        + '<path class="brow" d="M-10,-32 l6.5,3.2"/><path class="brow" d="M10,-32 l-6.5,3.2"/>'
      + '</g>'
      + '<g data-show="accept">'
        + '<path class="brow" d="M-10,-28.8 l6.5,-2.4"/><path class="brow" d="M10,-28.8 l-6.5,-2.4"/>'
      + '</g>'

      /* eyes */
      + '<g data-show="idle nervous stomp ring">'
        + '<circle class="eye" cx="-5" cy="-25" r="1.9"/><circle class="eye" cx="5" cy="-25" r="1.9"/>'
      + '</g>'
      + '<g data-show="panic">'
        + '<ellipse class="eye-w" cx="-5.2" cy="-25" rx="2.9" ry="3.2"/>'
        + '<ellipse class="eye-w" cx="5.2" cy="-25" rx="2.9" ry="3.2"/>'
        + '<circle class="eye" cx="-5.2" cy="-24.7" r="2"/>'
        + '<circle class="eye" cx="5.2" cy="-24.7" r="2"/>'
        + '<circle class="glint" cx="-6.1" cy="-25.9" r=".85"/>'
        + '<circle class="glint" cx="4.3" cy="-25.9" r=".85"/>'
      + '</g>'
      + '<g data-show="relieved gloat smug cheer gotcha-left gotcha-right">'
        + '<path class="shut" d="M-8.6,-24.6 q3.6,-3.6 7.2,0"/><path class="shut" d="M1.4,-24.6 q3.6,-3.6 7.2,0"/>'
      + '</g>'
      + '<g data-show="angry-left angry-right bristle">'
        + '<ellipse class="eye" cx="-5" cy="-25" rx="2.3" ry="1.35"/>'
        + '<ellipse class="eye" cx="5" cy="-25" rx="2.3" ry="1.35"/>'
      + '</g>'
      + '<g data-show="accept">'
        + '<path class="shut" d="M-8.6,-25.4 q3.6,3.4 7.2,0"/><path class="shut" d="M1.4,-25.4 q3.6,3.4 7.2,0"/>'
      + '</g>'

      + '%GLASSES%'
      + '</g>'

      /* mouths */
      + '<g%BANDM%>'
      + '<g data-show="idle ring"><path class="mouth" d="M-3.6,-17.6 q3.6,2.6 7.2,0"/></g>'
      + '<g data-show="stomp"><path class="mouth" d="M-3.6,-17 h7.2"/></g>'
      + '<g data-show="angry-left angry-right bristle"><path class="mouth" d="M-4,-16.6 q4,-2.9 8,0"/></g>'
      + '<g data-show="accept"><path class="mouth" d="M-3.6,-17 h7.2"/></g>'
      + '<g data-show="nervous"><g class="jaw"><ellipse class="mouth-f" cx="0" cy="-17" rx="4" ry="2.8"/></g></g>'
      + '<g data-show="panic"><ellipse class="mouth-f" cx="0" cy="-17.2" rx="2.9" ry="3.3"/></g>'
      + '<g data-show="doomed"><ellipse class="mouth-f" cx="0" cy="-16.8" rx="3.9" ry="4.7"/></g>'
      + '<g data-show="relieved"><path class="mouth-f" d="M-4.6,-18.6 a4.6,4.6 0 0 0 9.2,0 z"/></g>'
      + '<g data-show="gloat cheer gotcha-left gotcha-right">'
        + '<path class="mouth-f" d="M-5.6,-19 a5.6,5.6 0 0 0 11.2,0 z"/></g>'
      + '<g data-show="smug"><path class="mouth" d="M-4.2,-17.8 q4.2,2.4 8.4,-1.4"/></g>'
      + '</g>'
      + '</g>'

      /* a photo head, when the character has one, lands here */
      + '%PHOTO%'

      /* overlays: these read on a drawn head AND on a photo head */
      + '<g%BANDE%>'
      + '<g data-show="doomed">'
        + '<path class="xeye" d="M-8.2,-28 l5.6,5.6 M-2.6,-28 l-5.6,5.6"/>'
        + '<path class="xeye" d="M2.6,-28 l5.6,5.6 M8.2,-28 l-5.6,5.6"/>'
      + '</g>'
      + '<g data-show="relieved cheer"><path class="spark" d="M12.5,-35 v-5 M12.5,-35 l4,-3.4 M12.5,-35 l-4,-3.4"/></g>'
      + '<g data-show="angry-left angry-right bristle">'
        + '<path class="anger" d="M10.5,-36.5 l3.6,3.6 M14.1,-36.5 l-3.6,3.6'
        + ' M10.5,-32.4 l3.6,-3.6 M14.1,-32.4 l-3.6,-3.6"/>'
      + '</g>'
      + '</g>'
      + '</g>'
    + '</g>'

    /* arms — drawn last so they can cover the face */
    + '<g data-show="idle">'
      + limb(ARM_DOWN_L) + hand(-14,9) + limb(ARM_DOWN_R) + hand(14,9)
    + '</g>'
    /* waiting to start: linked up with whoever is either side */
    + '<g data-show="ring">'
      + limb('M-11,-4 C-23,-1 -34,0 -44,-3') + hand(-44,-3)
      + limb('M11,-4 C23,-1 34,0 44,-3')     + hand(44,-3)
    + '</g>'

    + '<g data-show="angry-right bristle">'
      + '<g class="pushfx"><path class="swoosh" d="M8,-18 h9 M7,4 h8"/></g>'
      + '<g class="shove-arms">'
        + limb('M-11,-4 C-3,3 9,2 17,-1')     + hand(17,-1)
        + limb('M11,-6 C15,-9 18,-10 21,-12') + hand(21,-12)
      + '</g>'
    + '</g>'
    + '<g data-show="angry-left">'
      + '<g class="pushfx"><path class="swoosh" d="M-8,-18 h-9 M-7,4 h-8"/></g>'
      + '<g class="shove-arms">'
        + limb('M11,-4 C3,3 -9,2 -17,-1')       + hand(-17,-1)
        + limb('M-11,-6 C-15,-9 -18,-10 -21,-12') + hand(-21,-12)
      + '</g>'
    + '</g>'
    + '<g data-show="accept">'
      + limb('M-11,-4 q-4,7 -2,13') + hand(-13,9)
      + limb('M11,-4 q4,7 2,13')    + hand(13,9)
    + '</g>'
    + '<g data-show="nervous">'
      + limb(ARM_DOWN_R) + hand(14,9)
      + limb('M-11,-5 q-6,-2 -2,-8 q2,-4 7,-3') + hand(-6,-16)
      + drop(13.5,-32)
    + '</g>'
    + '<g data-show="panic stomp">'
      + limb('M-11,-5 q-11,-8 -8,-22') + hand(-19,-27)
      + limb('M11,-5 q11,-8 8,-22') + hand(19,-27)
    + '</g>'
    + '<g data-show="doomed">'
      + limb('M-11,-5 q-7,-15 3,-26') + hand(-8,-31)
      + limb('M11,-5 q7,-15 -3,-26') + hand(8,-31)
    + '</g>'
    + '<g data-show="relieved">'
      + limb(ARM_DOWN_L) + hand(-14,9)
      + '<g class="wipe">' + limb('M11,-5 C22,-12 23,-25 6,-32') + hand(6,-32) + '</g>'
    + '</g>'
    /* gloat: one arm out pointing, the other clutching the belly, doubled over */
    + '<g data-show="gloat">'
      + limb('M-11,-3 C-7,2 -3,4 0,2.5') + hand(0,2.5)
      + '<g class="jab">' + limb('M11,-5 C16,-10 20,-14 24,-17') + hand(24,-17) + '</g>'
    + '</g>'
    /* smug: arms folded, thoroughly pleased */
    + '<g data-show="smug">'
      + limb('M-11,-3 C-6,1.5 4,1.5 9,-1.5')  + hand(9,-1.5)
      + limb('M11,-5.5 C6,-2 -4,-2 -9,-5')    + hand(-9,-5)
    + '</g>'
    /* gotcha: points at the victim they just shoved it onto, other hand on
       the hip. Mirrored, because which side the victim is on depends on which
       way the wheel was shoved. */
    + '<g data-show="gotcha-right">'
      + limb('M-11,-4 C-15,0 -14,4 -9.5,4.5') + hand(-9.5,4.5)
      + '<g class="jab">' + limb('M11,-6 C16,-10 21,-13 25,-14') + hand(25,-14) + '</g>'
    + '</g>'
    + '<g data-show="gotcha-left">'
      + limb('M11,-4 C15,0 14,4 9.5,4.5') + hand(9.5,4.5)
      + '<g class="jab">' + limb('M-11,-6 C-16,-10 -21,-13 -25,-14') + hand(-25,-14) + '</g>'
    + '</g>'

    /* cheer: both arms up */
    + '<g data-show="cheer">'
      + limb('M-11,-5 C-16,-11 -18,-18 -17,-25') + hand(-17,-25)
      + limb('M11,-5 C16,-11 18,-18 17,-25')     + hand(17,-25)
    + '</g>'
    + '</g>'

    /* Outside body-all on purpose: that group carries the doomed shake, the
       shove lean and the slump, and a shaking speech bubble cannot be read. */
    + '%BUBBLES%'
    + '</g>';

  /* ---------- model ---------- */
  /* Pre-drawn appearance features, chosen by the character's look.
     Geometry below is fitted to a reference photo: lens box and bridge are
     placed in units of pupil distance, hairline and beard line as fractions
     of head height. */
  /* Drawn behind the body. Only styles with a fall need an entry. */
  var HAIR_BACK = {
    'long': '<path class="hair" d="M-6,-30'
          + ' C-16,-31 -20,-24 -19,-12'
          + ' C-18.6,-5 -20,1 -19.4,7'
          + ' C-18.8,11.5 -15.6,13 -13.4,9'
          + ' C-11.6,4 -10,-6 -6,-26'
          + ' L6,-26'
          + ' C10,-6 11.6,4 13.4,9'
          + ' C15.6,13 18.8,11.5 19.4,7'
          + ' C20,1 18.6,-5 19,-12'
          + ' C20,-24 16,-31 6,-30 Z"/>'
  };

  var FRECKLES =
      '<g class="freckles">'
    + '<circle class="freckle" cx="-8" cy="-21.5" r=".55"/>'
    + '<circle class="freckle" cx="-5.6" cy="-19.8" r=".5"/>'
    + '<circle class="freckle" cx="-3.2" cy="-21.2" r=".5"/>'
    + '<circle class="freckle" cx="-6.4" cy="-23" r=".45"/>'
    + '<circle class="freckle" cx="3.2" cy="-21.2" r=".5"/>'
    + '<circle class="freckle" cx="5.6" cy="-19.8" r=".5"/>'
    + '<circle class="freckle" cx="8" cy="-21.5" r=".55"/>'
    + '<circle class="freckle" cx="6.4" cy="-23" r=".45"/>'
    + '</g>';

  /* Shoulders slope away from the neck instead of meeting it at a square
     corner, so the head reads as sitting on a body rather than on a box. */
  var TOP_PATH = 'M5,-9 C8.6,-9 11.6,-7 12,-3.5 L12,5'
               + ' A12,12 0 0 1 -12,5 L-12,-3.5 C-11.6,-7 -8.6,-9 -5,-9 Z';

  /* Only states that happen on the pointer slice get a bubble: that character
     is always upright at the top, so the text never ends up sideways. */
  var SAY = {
    'doomed':      ['not me', 'why me', 'oh no', 'nope', 'come on', 'unfair'],
    'angry-right': ['no way', 'nope', 'your turn'],
    'angry-left':  ['no way', 'nope', 'your turn'],
    'accept':      ['fine', 'figures', 'ok fine'],
    'bristle':     ['no way', 'hang on', 'nope'],
    'gotcha-right':['hah!', 'later', 'bye then', 'sucker'],
    'gotcha-left': ['hah!', 'later', 'bye then', 'sucker']
  };

  /* The box is rebuilt around whatever the character says, so a longer line
     cannot run under the border. Everything below is derived from these. */
  /* Drawn with the tail tip at the origin and the box up and to its right, so
     the whole thing can be dropped at a computed point. */
  var SAY_X0 = 5, SAY_TOP = -26, SAY_H = 18, SAY_R = 5,
      SAY_PAD = 5, SAY_MIN_W = 26;
  /* Where the tail sits relative to the head, measured on screen, not in the
     character's own frame - see aimBubble. */
  var SAY_HEAD_Y = -26, SAY_OFF_X = 13, SAY_OFF_Y = -12;

  function bubblePath(w){
    var x0 = SAY_X0, x1 = x0 + w, y0 = SAY_TOP, y1 = y0 + SAY_H, r = SAY_R;
    return 'M' + (x0 + r) + ',' + y0
         + ' H' + (x1 - r) + ' A' + r + ',' + r + ' 0 0 1 ' + x1 + ',' + (y0 + r)
         + ' V' + (y1 - r) + ' A' + r + ',' + r + ' 0 0 1 ' + (x1 - r) + ',' + y1
         + ' H' + (x0 + 11) + ' L0,0 L' + (x0 + 6) + ',' + y1
         + ' H' + (x0 + r) + ' A' + r + ',' + r + ' 0 0 1 ' + x0 + ',' + (y1 - r)
         + ' V' + (y0 + r) + ' A' + r + ',' + r + ' 0 0 1 ' + (x0 + r) + ',' + y0 + ' Z';
  }

  /* Counter-rotating about a fixed point in the character's own frame swung
     the box wherever the slice happened to be pointing - onto the face at
     around a quarter turn. Instead, place the tail at a fixed offset from the
     head *on screen*: rotate that offset back into local space, then undo the
     rotation so the words stay level. The box then sits above and right of
     the head whatever angle the character is at. */
  function aimBubble(g, net){
    var rad = net * Math.PI / 180, c = Math.cos(rad), sn = Math.sin(rad);
    var lx = SAY_OFF_X * c + SAY_OFF_Y * sn;
    var ly = -SAY_OFF_X * sn + SAY_OFF_Y * c;
    g.setAttribute('transform',
      'translate(' + lx.toFixed(2) + ',' + (SAY_HEAD_Y + ly).toFixed(2) + ')'
      + ' rotate(' + (-net).toFixed(1) + ')');
  }

  /* Measures the line as actually rendered, so it holds for any font or any
     wording added later. Falls back to an estimate if the node is not laid
     out yet (a hidden group reports zero). */
  function fitBubble(g){
    var t = g.querySelector('.say-text');
    t.setAttribute('y', SAY_TOP + SAY_H / 2 + 1.5);
    var len = 0;
    try { len = t.getComputedTextLength(); } catch(e) { len = 0; }
    if(!len) len = t.textContent.length * 4.6;
    var w = Math.max(SAY_MIN_W, len + SAY_PAD * 2);
    g.querySelector('.say-box').setAttribute('d', bubblePath(w));
    t.setAttribute('x', SAY_X0 + w / 2);
    return w;
  }

  var BUBBLE =
      '<g class="bubble-aim"><g class="bubble">'
    + '<path class="say-box" d="' + bubblePath(34) + '"/>'
    + '<text class="say-text" x="22" y="-16.5">?</text>'
    + '</g></g>';

  var COLLAR = '<path class="collar" d="M5,-9 C8.6,-9 11.6,-7 12,-3.5 L12,-0.6'
             + ' C11.5,-4.4 8.5,-6.3 5,-6.3 L-5,-6.3 C-8.5,-6.3 -11.5,-4.4 -12,-0.6'
             + ' L-12,-3.5 C-11.6,-7 -8.6,-9 -5,-9 Z"/>';

  /* Vertical stripes, clipped to the shirt so they follow its rounded hem.
     Kept few and thick: finer ones alias away at true wheel size. */
  function stripes(i, look){
    if(!look.stripe) return '';
    var id = 'topclip' + i;
    var xs = [-9.2, -4.6, 0, 4.6, 9.2];
    var out = '<clipPath id="' + id + '"><path d="' + TOP_PATH + '"/></clipPath>'
            + '<g clip-path="url(#' + id + ')">';
    for(var k = 0; k < xs.length; k++){
      out += '<rect x="' + (xs[k] - 0.8) + '" y="-9" width="1.6" height="28" fill="'
           + (k % 2 === 0 ? 'var(--stripe)' : 'var(--stripe2, var(--stripe))') + '"/>';
    }
    return out + '</g>';
  }

  var HAIR = {
    /* no hair; a highlight so the scalp reads as a scalp */
    'bald':    '<ellipse class="shine" cx="-4.6" cy="-31.5" rx="3.8" ry="2.3"'
             + ' transform="rotate(-22 -4.6 -31.5)"/>',
    'default': '<path class="hair" d="M-14,-25.5 a14,14 0 0 1 28,0'
             + ' q-5,-7 -14,-4.6 q-9,-2.4 -14,4.6 z"/>',
    /* swept up and over: taller on one side, fringe falling across */
    'swept':   '<path class="hair" d="M-13.9,-25'
             + ' C-15,-31 -12.5,-37 -6,-39'
             + ' C-1,-40.4 5,-39.6 9.6,-36.4'
             + ' C13,-33.6 14.5,-29 13.9,-25'
             + ' C13,-28.6 11,-30.6 7.6,-31.8'
             + ' C3.6,-33 -2,-32.4 -6.6,-31'
             + ' C-10,-30 -12.8,-28 -13.9,-25 Z"/>',
    /* a centre-parted cap whose side strands come down past the cheekbones */
    'long':    '<path class="hair" d="M-14.2,-16'
             + ' C-15.4,-25 -13,-33 -3,-37.4'
             + ' C-1,-38 1,-38 3,-37.4'
             + ' C13,-33 15.4,-25 14.2,-16'
             + ' C13.6,-20 13,-24.5 11.8,-27.5'
             + ' C7.6,-31 2.8,-31.8 0,-31.6'
             + ' C-2.8,-31.8 -7.6,-31 -11.8,-27.5'
             + ' C-13,-24.5 -13.6,-20 -14.2,-16 Z"/>',
    'curly':   '<path class="hair" d="M-13.9,-24'
             + ' C-15.4,-29 -14.6,-34 -10.6,-36.8'
             + ' C-8.8,-40.6 -4,-42 -0.2,-41'
             + ' C3.6,-42 7.8,-40.4 9.8,-36.6'
             + ' C13.8,-33.8 14.6,-29 13.9,-24'
             + ' C13.2,-28.4 11.4,-30.6 8.2,-31.8'
             + ' C4.4,-33.2 -1.2,-33.2 -5.6,-32.2'
             + ' C-9.6,-31.2 -12.6,-28.8 -13.9,-24 Z"/>',
    'thick':   '<path class="hair" d="M-13.86,-26 A14,14 0 0 1 13.86,-26'
             + ' C13.4,-27.4 11.8,-28.9 8.6,-30'
             + ' C4.8,-31.2 -1,-31.2 -5.4,-30.3'
             + ' C-9.4,-29.4 -12.6,-28 -13.86,-26 Z"/>'
  };

  var BEARD = {
    /* trimmed: follows the jaw and stops at the chin */
    'trim': '<path class="beard" d="M-13.95,-24.5'
          + ' C-13.2,-19.6 -10.4,-16.6 -6.6,-17.4'
          + ' C-3.4,-20 3.4,-20 6.6,-17.4'
          + ' C10.4,-16.6 13.2,-19.6 13.95,-24.5'
          + ' A14,14 0 0 1 -13.95,-24.5 Z"/>',
    /* stubble: hugs the jaw and is drawn faint rather than solid */
    'stubble': '<path class="beard stubble" d="M-13.42,-20'
             + ' C-13,-17.4 -10.6,-15.6 -6.8,-16.6'
             + ' C-3.4,-19.4 3.4,-19.4 6.8,-16.6'
             + ' C10.6,-15.6 13,-17.4 13.42,-20'
             + ' A14,14 0 0 1 -13.42,-20 Z"/>',
    /* full: starts up by the ears and hangs past the jaw onto the chest */
    'full': '<path class="beard" d="M-13.86,-26'
          + ' C-13.4,-21 -10.6,-18.6 -6.8,-19.6'
          + ' C-3.4,-22 3.4,-22 6.8,-19.6'
          + ' C10.6,-18.6 13.4,-21 13.86,-26'
          + ' C15.2,-18.5 14.2,-10.5 10,-6'
          + ' C6,-2 -6,-2 -10,-6'
          + ' C-14.2,-10.5 -15.2,-18.5 -13.86,-26 Z"/>'
  };

  var GLASSES = {
    /* wide, shallow lenses sitting low over the cheek */
    'wide': '<g class="glasses">'
          + '<rect x="-9.85" y="-27" width="8.8" height="6.3" rx="2.1"/>'
          + '<rect x="1.05" y="-27" width="8.8" height="6.3" rx="2.1"/>'
          + '<path d="M-1.05,-25.8 q1.05,-1.2 2.1,0"/>'
          + '<path d="M-9.85,-26.2 L-13.7,-24.6"/>'
          + '<path d="M9.85,-26.2 L13.7,-24.6"/>'
          + '</g>',
    /* taller lenses, centred on the eye rather than hung below it */
    'tall': '<g class="glasses">'
          + '<rect x="-10" y="-28.7" width="9.35" height="7.2" rx="2.4"/>'
          + '<rect x="0.65" y="-28.7" width="9.35" height="7.2" rx="2.4"/>'
          + '<path d="M-0.65,-27.3 q0.65,-1.2 1.3,0"/>'
          + '<path d="M-10,-27.6 L-13.8,-25.8"/>'
          + '<path d="M10,-27.6 L13.8,-25.8"/>'
          + '</g>'
  };

  /* A photo head, when the character has one. Falls back to the drawn head. */
  /* Head geometry. The rig is drawn against a circle of r=14 centred at
     (0,-24) with the chin at y=-10; a look's head {rx,ry} restates that as an
     ellipse, scaled about the chin so the neck joint never moves. */
  function headTransforms(look){
    var h = look.head;
    if(!h) return { head:'', eyes:'', mouth:'' };
    var sx = h.rx/14, sy = h.ry/14, inv = 1/sy;
    var n = function(v){ return Math.round(v*10000)/10000; };
    var band = function(y){
      return ' transform="translate(0,'+y+') scale(1,'+n(inv)+') translate(0,'+(-y)+')"';
    };
    return {
      head:  ' transform="translate(0,-10) scale('+n(sx)+','+n(sy)+') translate(0,10)"',
      eyes:  band(-25),
      mouth: band(-17.5)
    };
  }

  function charMarkup(i, c){
    var look = c.look || {};
    var T = headTransforms(look);
    var photo = '';
    if(c.headImage){
      var id = 'headclip' + i;
      photo = '<g class="photo-head">'
            + '<clipPath id="' + id + '"><circle cx="0" cy="-24" r="14"/></clipPath>'
            + '<image href="' + c.headImage + '" x="-14.5" y="-39" width="29" height="29"'
            + ' preserveAspectRatio="xMidYMid slice" clip-path="url(#' + id + ')"/>'
            + '<circle class="photo-ring" cx="0" cy="-24" r="14"/>'
            + '<g data-show="doomed">'
              + '<path class="xeye-halo" d="M-8.2,-28 l5.6,5.6 M-2.6,-28 l-5.6,5.6"/>'
              + '<path class="xeye-halo" d="M2.6,-28 l5.6,5.6 M8.2,-28 l-5.6,5.6"/>'
            + '</g>'
            + '</g>';
    }
    return CHAR_MARKUP
      .replace('%PHOTO%',   function(){ return photo; })
      .replace('%BEARD%',   function(){
        return look.beard ? (BEARD[look.beardStyle] || BEARD['trim']) : '';
      })
      .replace('%GLASSES%', function(){
        return look.glasses ? (GLASSES[look.glasses] || GLASSES['wide']) : '';
      })
      .replace('%HAIR%',     function(){
        var st = look.hairStyle;
        return (st && HAIR[st] !== undefined) ? HAIR[st] : HAIR['default'];
      })
      .replace('%HAIRBACK%', function(){
        var back = HAIR_BACK[look.hairStyle];
        return back ? '<g class="hair-back"' + T.head + '>' + back + '</g>' : '';
      })
      .replace('%FRECKLES%', function(){ return look.freckles ? FRECKLES : ''; })
      .replace('%TOP%',      function(){ return '<path class="top" d="' + TOP_PATH + '"/>'; })
      .replace('%BUBBLES%',  function(){
        var out = '';
        for(var st in SAY){ out += '<g data-show="' + st + '">' + BUBBLE + '</g>'; }
        return out;
      })
      .replace('%COLLAR%',   function(){ return look.collar ? COLLAR : ''; })
      .replace('%STRIPES%',  function(){ return stripes(i, look); })
      .replace('%HEADT%',    function(){ return T.head; })
      .replace(/%BANDE%/g,   function(){ return T.eyes; })
      .replace('%BANDM%',    function(){ return T.mouth; });
  }

  /* Fisher-Yates. Only the opening arrangement is shuffled: re-shuffling on
     every edit would scramble the wheel under the user mid-keystroke. */
  function shuffled(list){
    var a = list.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function parseNames(text){
    return text.split('\n')
      .map(function(s){ return s.trim(); })
      .filter(function(s){ return s.length; })
      .slice(0, MAX);
  }

  function buildCharacters(names){
    var prev = {};
    characters.forEach(function(c){ prev[c.name] = c; });
    var n = Math.max(names.length,1);
    characters = names.map(function(name,i){
      var old = prev[name];
      return {
        name: name,
        state: 'idle',
        hue: Math.round((i*360/n + 14) % 360),
        headImage: old ? old.headImage : null,
        look: old ? old.look : (SEED_LOOKS[name] || null)
      };
    });
  }

  /* ------------------------------------------------------------------
     SEAM 2: setState is the ONLY place a character's appearance changes.
  ------------------------------------------------------------------ */
  function setState(index, state){
    var c = characters[index];
    if(!c || c.state === state) return;
    c.state = state;
    var el = charEls[index];
    if(!el) return;
    el.setAttribute('data-state', state);

    speak(el, state, index);
  }

  /* Give the character its line, size the box to it, and swing the bubble
     level - the winner can be tilted by up to half a slice. */
  function speak(el, state, index){
    var lines = SAY[state];
    if(!lines) return;
    var g = el.querySelector('[data-show~="' + state + '"] .bubble-aim');
    if(!g) return;
    g.querySelector('.say-text').textContent =
      lines[Math.floor(Math.random() * lines.length)];
    fitBubble(g);
    /* `rotation` is the target, not what the matrix currently reads. Measuring
       mid-transition put the bubble out by exactly one slice - the same trap
       that once made the shove announce the wrong name. */
    aimBubble(g, index * 360 / characters.length + rotation);
  }

  /* ---------- rendering ---------- */
  function slicePath(i,n){
    if(n === 1){
      return 'M'+CX+','+(CY-R)+' A'+R+','+R+' 0 1 1 '+(CX-0.01)+','+(CY-R)+' Z';
    }
    var seg = 360/n;
    var a = polar(i*seg - seg/2, R), b = polar(i*seg + seg/2, R);
    return 'M'+CX+','+CY+' L'+f(a[0])+','+f(a[1])
         + ' A'+R+','+R+' 0 '+(seg > 180 ? 1 : 0)+' 1 '+f(b[0])+','+f(b[1])+' Z';
  }

  function render(){
    var n = characters.length;
    charEls = [];

    if(!n){
      svg.innerHTML = '<circle class="rim" cx="200" cy="200" r="'+R+'"/>'
                    + '<text class="empty" x="200" y="200">Add some names</text>';
      spinBtn.disabled = true;
      return;
    }
    spinBtn.disabled = spinning;

    var seg    = 360/n;
    var rChar  = R*0.55;
    var rLabel = R*0.89;
    var chordC = n === 1 ? 2*rChar  : 2*rChar  * Math.sin(Math.PI/n);
    var chordL = n === 1 ? 2*rLabel : 2*rLabel * Math.sin(Math.PI/n);
    var scale  = Math.max(0.42, Math.min(1.15, chordC/56));
    /* Where the ring has to sit for the linking hands to actually touch. The
       arm points along the character's own tangent, not along the chord to
       the next one, so it is NOT simply half the gap between them - sizing it
       that way left everyone short by a factor of cos(seg/2). */
    var segR  = 2 * Math.PI / n;
    var ringR = n < 2 ? rChar
      : scale * (44 * (1 + Math.cos(segR)) / Math.sin(segR) - 3);
    ringR = Math.min(rChar, Math.max(ringR, 38 + 24 * scale));
    var pull = (rChar - ringR) / scale;
    var fs     = Math.max(7, Math.min(16, chordL*0.5));

    var out = '';
    characters.forEach(function(c,i){
      out += '<path class="slice'+(c.name === chosenJumper ? ' chosen' : '')+'"'
           + ' data-i="'+i+'" style="--hue:'+c.hue+'" d="'+slicePath(i,n)+'"/>';
    });
    out += '<circle class="rim" cx="200" cy="200" r="'+R+'"/>';

    characters.forEach(function(c,i){
      var ang = i*seg;
      var L = polar(ang, rLabel), P = polar(ang, rChar);
      out += '<text class="label" x="'+f(L[0])+'" y="'+f(L[1])+'"'
           + ' font-size="'+f(fs)+'" transform="rotate('+f(ang)+' '+f(L[0])+' '+f(L[1])+')">'
           + esc(trunc(c.name)) + '</text>';
      var look = c.look || {};
      var vars = '--hue:'+c.hue+';--d:'+(i*0.37).toFixed(2)+'s'
               + ';--pull:'+pull.toFixed(1)
               + (look.skin ? ';--skin:'+look.skin : '')
               + (look.hair  ? ';--hair:'+look.hair : '')
               + (look.beard && look.beard !== true ? ';--beard:'+look.beard : '')
               + (look.top    ? ';--top-col:'+look.top : '')
               + (look.lip    ? ';--lip:'+look.lip : '')
               + (look.collar  ? ';--collar:'+look.collar : '')
               + (look.stripe  ? ';--stripe:'+look.stripe : '')
               + (look.stripe2 ? ';--stripe2:'+look.stripe2 : '');
      out += '<g data-i="'+i+'" class="char'+(c.headImage ? ' has-photo' : '')
           + (look.beard ? ' bearded' : '')+(look.lip ? ' lips' : '')+'"'
           + ' data-state="'+c.state+'"'
           + ' style="'+vars+'"'
           + ' transform="translate('+f(P[0])+' '+f(P[1])+') rotate('+f(ang)+') scale('+f(scale)+')">'
           + charMarkup(i, c) + '</g>';
    });

    svg.innerHTML = out;
    charEls = Array.prototype.slice.call(svg.querySelectorAll('.char'));
  }

  /* ---------- spin ---------- */
  function liveAngle(){
    var t = getComputedStyle(wheel).transform;
    if(!t || t === 'none') return 0;
    try{
      var m = new DOMMatrixReadOnly(t);
      return Math.atan2(m.b, m.a) * 180/Math.PI;
    }catch(e){
      var nums = t.replace(/^matrix\(|\)$/g,'').split(',').map(parseFloat);
      return Math.atan2(nums[1], nums[0]) * 180/Math.PI;
    }
  }

  function pointerIndex(){
    var n = characters.length;
    if(!n) return -1;
    return mod(Math.round(-liveAngle()/(360/n)), n);
  }

  /* live loop: fear spreads outward from whatever is under the pointer */
  function tick(){
    var n = characters.length;
    if(n){
      var p = pointerIndex();
      var near = n <= 6 ? 1 : 2;
      for(var i=0;i<n;i++){
        var d = Math.min(mod(i-p,n), mod(p-i,n));
        setState(i, d === 0 ? 'panic' : (d <= near ? 'nervous' : 'idle'));
      }
    }
    if(spinning) rafId = requestAnimationFrame(tick);
  }

  /* Durations are read out of the stylesheet at start-up (see syncTimings).
     Only the keyframe PERCENTAGES live here, because those are the thing the
     JS genuinely needs to know; a duplicated duration has already gone stale
     once and silently truncated a pose. */
  var STOMP_IMPACT_PCT = 0.74;  /* the landing keyframe */
  var STOMP_ANIM, STOMP_IMPACT, STOMP_FOLLOW;

  /* When it fires, the picked one bristles and then does one of three things.
     A third of the time they cave, so the result only actually moves on about
     two thirds of these. */
  /* Every landing ends one of these three ways, evenly. */
  var SHOVE_OPTIONS = ['right', 'left', 'accept'];
  var SHOVE_HEAVE_PCT = 0.45;   /* the heave keyframe */
  /* Long enough to read the name and believe it, short enough to stay a
     punchline. 620ms landed before anyone had taken the result in; 1900ms
     sagged. */
  var SHOVE_BEAT   = 1100;
  var SHOVE_STEP   = 430;  /* how long the wheel takes to clunk round one slice */
  var SHOVE_ANIM, SHOVE_HEAVE, ACCEPT_BEAT, SHOVE_REST;

  /* Measure an animation's length off a real character instead of repeating
     the number from the CSS. */
  function animMs(state, sel){
    var host = charEls[0];
    if(!host) return 0;
    var was = host.getAttribute('data-state');
    host.setAttribute('data-state', state);
    var node = host.querySelector(sel);
    var raw = node ? getComputedStyle(node).animationDuration.split(',')[0].trim() : '';
    host.setAttribute('data-state', was);
    if(!raw) return 0;
    return raw.slice(-2) === 'ms' ? parseFloat(raw) : parseFloat(raw) * 1000;
  }

  function syncTimings(){
    STOMP_ANIM   = animMs('stomp', '.body-all') || 1000;
    STOMP_IMPACT = Math.round(STOMP_ANIM * STOMP_IMPACT_PCT);
    STOMP_FOLLOW = STOMP_ANIM - STOMP_IMPACT + 40;

    SHOVE_ANIM   = animMs('angry-right', '.body-all') || 1000;
    SHOVE_HEAVE  = Math.round(SHOVE_ANIM * SHOVE_HEAVE_PCT);
    /* the wind-up holds its pose, so this only needs to outlast it */
    ACCEPT_BEAT  = (animMs('bristle', '.body-all') || 500) + 260;
    SHOVE_REST   = Math.max(SHOVE_STEP + 40, SHOVE_ANIM - SHOVE_HEAVE + 30);
  }

  function reduceMotion(){
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  /* The character under the pointer boots the hub; the wheel goes when the
     landing hits. With reduced motion there is nothing to wait for. */
  /* Before the first spin: everyone closes in, joins hands and the whole ring
     turns slowly. Uses the wheel's own transform so `rotation` stays the one
     source of truth for where the wheel is - an extra rotation layer would
     have put pointerIndex() out. */
  function drift(){
    if(spinning) return;
    wheel.style.transition = 'transform ' + DRIFT_MS + 'ms linear';
    void wheel.offsetWidth;
    rotation += 360;
    wheel.style.transform = 'rotate(' + rotation + 'deg)';
    driftTimer = setTimeout(drift, DRIFT_MS);
  }

  function restPose(){
    clearTimeout(driftTimer);
    for(var i=0;i<characters.length;i++) setState(i, 'ring');
    wheel.classList.add('resting');
    drift();
  }

  /* Hand the drift over to the spin: freeze the wheel where it visually is,
     then carry on from there. */
  function endDrift(){
    clearTimeout(driftTimer);
    if(!wheel.classList.contains('resting')) return;
    wheel.classList.remove('resting');
    var live = mod(liveAngle(), 360);
    rotation = Math.floor(rotation / 360) * 360 + live;
    wheel.style.transition = 'none';
    wheel.style.transform = 'rotate(' + rotation + 'deg)';
    void wheel.offsetWidth;
  }

  function spin(){
    if(spinning || !characters.length) return;
    endDrift();
    spinning = true;
    spinBtn.disabled = true;
    resultEl.textContent = 'Spinning…';

    var stomper = -1;
    if(chosenJumper){
      for(var k = 0; k < characters.length; k++){
        if(characters[k].name === chosenJumper) stomper = k;
      }
    }
    if(stomper < 0) stomper = pointerIndex();
    for(var i=0;i<characters.length;i++) setState(i, i === stomper ? 'stomp' : 'idle');

    clearTimeout(stompTimer);
    clearTimeout(shoveTimer);
    stompTimer = setTimeout(launch, reduceMotion() ? 0 : STOMP_IMPACT);
  }

  function launch(){
    if(!spinning) return;
    wheel.classList.add('spinning');
    var dur = 5500 + Math.random()*2500;
    rotation += 360*(5 + Math.floor(Math.random()*4)) + Math.random()*360;

    /* Eased so the wheel keeps visibly moving through the first half and then
       winds down. The old curve put half the rotation into the first tenth of
       the time and crawled through the rest, which read as a sprint and a
       stall rather than a wheel slowing under friction. */
    wheel.style.transition = 'transform ' + Math.round(dur)
                           + 'ms cubic-bezier(.18,.58,.22,1)';
    void wheel.offsetWidth;
    wheel.style.transform = 'rotate(' + rotation + 'deg)';

    /* let the leg finish its swing before the fear loop repaints everyone */
    cancelAnimationFrame(rafId);
    clearTimeout(holdTimer);
    holdTimer = setTimeout(tick, reduceMotion() ? 0 : STOMP_FOLLOW);
    clearTimeout(stopTimer);
    stopTimer = setTimeout(stop, dur + 80);
  }

  /* Four ways of not being the one picked. Dealt from a shuffled deck rather
     than drawn independently, so with four or fewer survivors every one of
     them reacts differently; picking at random gave three the same pose about
     half the time. */
  var CHEERS = ['relieved', 'gloat', 'smug', 'cheer'];

  function settle(p, prefix){
    var deck = [];
    for(var i=0;i<characters.length;i++){
      if(i === p){ setState(i, 'doomed'); continue; }
      if(!deck.length) deck = shuffled(CHEERS);
      setState(i, deck.pop());
    }
    resultEl.textContent = p >= 0
      ? (prefix || '') + characters[p].name + ' — it’s you.'
      : 'Ready when you are.';
  }

  function shouldShove(){
    return soreEl.checked && characters.length >= 2;
  }

  /* The gag: the picked one shoves the wheel on one notch, so the neighbour
     slides under the pointer and wears it instead. Deliberately loud — the
     result line says what happened, or it just looks like a bug. */
  function shove(p){
    var n = characters.length;
    var name = characters[p].name;
    var pick = SHOVE_OPTIONS[Math.floor(Math.random() * SHOVE_OPTIONS.length)];

    /* They square up either way; whether anything comes of it is the joke. */
    if(pick === 'accept'){
      setState(p, 'bristle');
      shoveTimer = setTimeout(function(){
        setState(p, 'accept');
        resultEl.textContent = name + ' almost passed it on. Still ' + name + '.';
        spinBtn.disabled = false;
      }, reduceMotion() ? 0 : ACCEPT_BEAT);
      return;
    }

    /* Shoving right rolls the wheel on a slice, so the pointer lands one index
       back; shoving left rolls it the other way. Work the victim out rather
       than reading it off the matrix afterwards — a delayed or interrupted
       transition would otherwise announce the wrong name. */
    var dir = pick === 'right' ? 1 : -1;
    var victim = mod(p - dir, n);
    setState(p, dir > 0 ? 'angry-right' : 'angry-left');

    var step = function(){
      var ms = reduceMotion() ? 0 : SHOVE_STEP;
      /* Land the victim dead centre under the pointer. A blind one-slice step
         would carry over whatever offset the spin happened to stop at, so the
         wheel stayed as crooked as it was before the shove. */
      var seg = 360 / n;
      var target = mod(-victim * seg, 360);
      var cur = mod(rotation, 360);
      rotation += dir > 0 ? mod(target - cur, 360) : -mod(cur - target, 360);
      wheel.style.transition = 'transform ' + ms + 'ms cubic-bezier(.34,1.28,.64,1)';
      void wheel.offsetWidth;
      wheel.style.transform = 'rotate(' + rotation + 'deg)';
      setTimeout(function(){
        settle(victim, name + ' wasn’t having it. ');
        /* The shover was in the firing line a second ago and got out of it by
           putting someone else in - that is not the same feeling as the
           bystanders', so it does not get the same pose. Points back at the
           slice they shoved it to. */
        setState(p, dir > 0 ? 'gotcha-left' : 'gotcha-right');
        spinBtn.disabled = false;
      }, reduceMotion() ? 0 : SHOVE_REST);
    };

    if(reduceMotion()) step();
    else shoveTimer = setTimeout(step, SHOVE_HEAVE);
  }

  function stop(){
    if(!spinning) return;
    spinning = false;
    wheel.classList.remove('spinning');
    cancelAnimationFrame(rafId);
    clearTimeout(stopTimer);
    clearTimeout(stompTimer);
    clearTimeout(holdTimer);

    var p = pointerIndex();
    settle(p);

    if(p >= 0 && shouldShove()){
      clearTimeout(shoveTimer);
      shoveTimer = setTimeout(function(){ shove(p); }, reduceMotion() ? 0 : SHOVE_BEAT);
    }else{
      spinBtn.disabled = false;
    }
  }

  /* transitionend BUBBLES. Without the target check, any transition on
     anything inside the wheel ends the spin - the ring releasing its hold at
     0.7s was landing 40ms before launch() and settling the wheel without it
     ever turning. Only the wheel's own transform may stop a spin. */
  wheel.addEventListener('transitionend', function(e){
    if(e.target === wheel && e.propertyName === 'transform') stop();
  });

  /* ---------- photos ---------- */
  function renderFaces(){
    facesEl.innerHTML = characters.map(function(c,i){
      var av = c.headImage
        ? '<span class="av"><img src="'+c.headImage+'" alt=""></span>'
        : '<span class="av" style="--hue:'+c.hue+'">'+esc(c.name.charAt(0).toUpperCase())+'</span>';
      return '<span class="face'+(c.headImage ? ' set' : '')+'">'
           + '<button class="face-btn" type="button" data-i="'+i+'">'+av+esc(trunc(c.name))+'</button>'
           + (c.headImage
               ? '<button class="face-x" type="button" data-clear="'+i+'"'
                 + ' aria-label="Remove the photo for '+esc(c.name)+'">&times;</button>'
               : '')
           + '</span>';
    }).join('');
  }

  function setHeadImage(index, url){
    if(!characters[index]) return;
    characters[index].headImage = url;
    render();
    renderFaces();
  }

  /* centre-crop to a square and shrink, so a 4MB phone photo stays cheap */
  function squareDataURL(file, size, done){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        /* Bias the crop up and in: in most snapshots the face sits above centre,
           so a plain centre crop leaves the head tiny inside the slice. */
        var side = Math.min(img.width, img.height) * 0.62;
        var sx = (img.width - side)/2;
        var sy = Math.max(0, Math.min(img.height - side, img.height*0.40 - side/2));
        var cv = document.createElement('canvas');
        cv.width = cv.height = size;
        cv.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, size, size);
        done(cv.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = function(){ resultEl.textContent = 'That file would not load as an image.'; };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  facesEl.addEventListener('click', function(e){
    var b = e.target.closest('button');
    if(!b) return;
    if(b.dataset.clear !== undefined){
      setHeadImage(+b.dataset.clear, null);
    }else if(b.dataset.i !== undefined){
      pendingFace = +b.dataset.i;
      fileEl.value = '';
      fileEl.click();
    }
  });

  fileEl.addEventListener('change', function(){
    var file = fileEl.files && fileEl.files[0];
    if(!file || pendingFace < 0) return;
    var i = pendingFace;
    pendingFace = -1;
    squareDataURL(file, 256, function(url){ setHeadImage(i, url); });
  });

  /* ---------- per-character menu ---------- */
  var menuEl = document.getElementById('menu');
  var menuWho = document.getElementById('menuWho');
  var menuFor = -1;

  function closeMenu(){ menuEl.hidden = true; menuFor = -1; }

  function openMenu(index, x, y){
    var c = characters[index];
    if(!c) return;
    menuFor = index;
    menuWho.textContent = c.name;
    menuEl.querySelector('[data-act="jump"]').textContent =
      (c.name === chosenJumper) ? 'Stop them jumping' : 'Make them the jumper';
    menuEl.querySelector('[data-act="remove"]').disabled = characters.length < 2;
    menuEl.hidden = false;
    /* place at the click, then pull back inside the viewport */
    var r = menuEl.getBoundingClientRect();
    menuEl.style.left = Math.min(x, innerWidth  - r.width  - 8) + 'px';
    menuEl.style.top  = Math.min(y, innerHeight - r.height - 8) + 'px';
  }

  svg.addEventListener('click', function(e){
    if(spinning) return;
    var hit = e.target.closest ? e.target.closest('[data-i]') : null;
    if(!hit) return;
    openMenu(+hit.getAttribute('data-i'), e.clientX, e.clientY);
  });

  menuEl.addEventListener('click', function(e){
    var b = e.target.closest('button');
    if(!b || menuFor < 0) return;
    var c = characters[menuFor];

    if(b.dataset.act === 'jump'){
      chosenJumper = (c.name === chosenJumper) ? null : c.name;
      render();
      resultEl.textContent = chosenJumper
        ? chosenJumper + ' will start the next spin.'
        : 'Back to whoever the pointer lands on.';
    }else if(b.dataset.act === 'remove'){
      if(characters.length < 2) return;
      if(c.name === chosenJumper) chosenJumper = null;
      var names = parseNames(namesEl.value);
      names.splice(menuFor, 1);
      namesEl.value = names.join('\n');
      buildCharacters(names);
      render();
      renderFaces();
      resultEl.textContent = c.name + ' is out. ' + names.length + ' left.';
    }
    closeMenu();
  });

  /* capture phase: runs before the svg handler, so opening a menu from one
     slice while another is open still works */
  document.addEventListener('click', function(e){
    if(menuEl.hidden) return;
    if(!menuEl.contains(e.target)) closeMenu();
  }, true);

  /* ---------- wiring ---------- */
  spinBtn.addEventListener('click', spin);

  var cogEl = document.getElementById('cog');
  var panelEl = document.getElementById('panel');
  cogEl.addEventListener('click', function(){
    var open = panelEl.hidden;
    panelEl.hidden = !open;
    cogEl.setAttribute('aria-expanded', String(open));
    cogEl.textContent = open ? 'Close' : 'Names';
  });
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    if(!menuEl.hidden) closeMenu();
    else if(!panelEl.hidden) cogEl.click();
  });

  namesEl.addEventListener('input', function(){
    buildCharacters(parseNames(namesEl.value));
    render();
    renderFaces();
    if(!spinning){ resultEl.textContent = 'Ready when you are.'; restPose(); }
  });

  var opening = shuffled(DEFAULT_NAMES);
  var ALL_STATES = ['idle','nervous','panic','doomed','relieved',
                    'stomp','angry-right','angry-left','bristle','accept',
                    'gloat','smug','cheer','gotcha-right','gotcha-left','ring'];

  /* ------------------------------------------------------------------
     ?inspect - the contact sheet.
     Every state on every character, frozen, at the size they actually
     render on the wheel. Nearly every art bug in this file was invisible
     at 300px and obvious here, so it ships with the page.
  ------------------------------------------------------------------ */
  function cell(src, state, atFraction, px, label, say){
    var box = document.createElement('div');
    box.className = 'ins-cell';
    box.style.width = px + 'px';
    box.innerHTML = '<svg viewBox="-54 -66 108 104"></svg><b></b>';
    box.querySelector('b').textContent = label;
    var g = src.cloneNode(true);
    g.removeAttribute('transform');
    g.setAttribute('data-state', state);
    g.setAttribute('style', src.getAttribute('style'));
    var aim = g.querySelector('[data-show~="' + state + '"] .bubble-aim');
    if(aim){
      aimBubble(aim, 0);   /* placed as the user sees it, minus the rotation */
      if(SAY[state]){
        aim.querySelector('.say-text').textContent = say != null ? say : SAY[state][0];
        aim.setAttribute('data-refit', '');   /* sized once it is in the document */
      }
    }
    box.querySelector('svg').appendChild(g);
    if(atFraction != null){
      var secs = -(atFraction * (animMs(state, '.body-all') || 1000) / 1000);
      g.querySelectorAll('*').forEach(function(el){
        el.style.animationDelay = secs + 's';
        el.style.animationPlayState = 'paused';
      });
    }
    return box;
  }

  /* The trap that has bitten this file three times: a CSS animation silently
     overwrites an element's SVG transform attribute. Anything holding both is
     a bug waiting to happen. */
  function transformAudit(){
    var hits = [];
    charEls.forEach(function(host){
      var was = host.getAttribute('data-state');
      ALL_STATES.forEach(function(st){
        host.setAttribute('data-state', st);
        host.querySelectorAll('[transform]').forEach(function(el){
          if(getComputedStyle(el).animationName !== 'none'){
            hits.push(st + '  ' + (el.getAttribute('class') || el.nodeName));
          }
        });
      });
      host.setAttribute('data-state', was);
    });
    return hits.filter(function(v, i, a){ return a.indexOf(v) === i; });
  }

  function bubbleAudit(){
    var bad = [], host = charEls[0];
    if(!host) return ['no characters to measure'];
    var was = host.getAttribute('data-state');
    Object.keys(SAY).forEach(function(st){
      host.setAttribute('data-state', st);
      var g = host.querySelector('[data-show~="' + st + '"] .bubble-aim');
      if(!g){ bad.push(st + ': no bubble'); return; }
      var t = g.querySelector('.say-text');
      SAY[st].forEach(function(line){
        t.textContent = line;
        var w = fitBubble(g), len = t.getComputedTextLength();
        if(len > w - SAY_PAD * 2 + 0.5){
          bad.push(st + ' "' + line + '" overflows by '
                   + (len - (w - SAY_PAD * 2)).toFixed(1));
        }
      });
    });
    host.setAttribute('data-state', was);
    return bad;
  }

  function inspect(){
    var page = document.createElement('div');
    page.className = 'inspect';
    var names = characters.map(function(c){ return c.name; });

    function row(title, build){
      var h = document.createElement('h2');
      h.textContent = title;
      page.appendChild(h);
      var line = document.createElement('div');
      line.className = 'ins-row';
      build(line);
      page.appendChild(line);
    }

    function note(bad, okText, badText){
      var p = document.createElement('p');
      p.className = 'ins-audit' + (bad.length ? ' bad' : '');
      p.textContent = bad.length ? badText + ' - ' + bad.join(' | ') : okText;
      page.appendChild(p);
    }

    note(transformAudit(),
         'transform audit clean - no element carries both an SVG transform '
         + 'attribute and a CSS animation.',
         'transform trap');

    var speech = bubbleAudit();
    note(speech,
         'speech audit clean - all ' + Object.keys(SAY).reduce(function(n, k){
            return n + SAY[k].length; }, 0)
         + ' lines fit inside their bubble.',
         'speech overflows the bubble');

    ALL_STATES.forEach(function(st){
      row(st + ' - every character, true wheel size', function(line){
        charEls.forEach(function(src, i){
          line.appendChild(cell(src, st, null, 132, names[i]));
        });
      });
    });

    Object.keys(SAY).forEach(function(st){
      row(st + ' - every line it can say', function(line){
        SAY[st].forEach(function(txt){
          line.appendChild(cell(charEls[0], st, null, 150, '"' + txt + '"', txt));
        });
      });
    });

    ['stomp','angry-right','accept','doomed','panic'].forEach(function(st){
      row(st + ' - frame by frame', function(line){
        [0,.15,.3,.45,.6,.74,.85,1].forEach(function(f){
          line.appendChild(cell(charEls[0], st, f, 118, Math.round(f*100) + '%'));
        });
      });
    });

    row('large', function(line){
      ALL_STATES.forEach(function(st){
        line.appendChild(cell(charEls[0], st, null, 250, st));
      });
    });

    document.body.innerHTML = '';
    document.body.appendChild(page);
    /* now they are laid out, the boxes can be measured and sized */
    page.querySelectorAll('[data-refit]').forEach(fitBubble);
    document.title = 'Name Wheel - inspect';
  }

  if(/\binspect\b/.test(location.search)) setTimeout(inspect, 0);

  namesEl.value = opening.join('\n');
  buildCharacters(opening);
  render();
  renderFaces();
  syncTimings();
  restPose();
})();
</script>
</body>
</html>
